# Tile wall: nginx configuration, because the default image runs its worker as
# the nginx user, which cannot read the mounted directory on a NAS filesystem.
#
# On UGOS-Btrfs non-root users in containers are denied any access to bind
# mounts — the directories are readable for all, the worker still may not. That
# is why the worker runs as root here. The page is static, the mount is
# read-only, the container has a read-only root file system.
user root;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    # The root system is read-only, the directories must lie elsewhere.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # The http only redirects to https. Whoever types an old address or opens
    # an old bookmark file arrives there.
    server {
        listen 80;
        server_name _;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Own certificate, copied into ./ssl on the server. See GUIDE.md.
        # The files are read-only there.
        ssl_certificate     /etc/nginx/ssl/wall.fullchain.crt;
        ssl_certificate_key /etc/nginx/ssl/wall.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:tls:1m;
        ssl_session_timeout 1h;

        # Everything is static: create nothing, execute nothing.
        location / {
            try_files $uri $uri/ =404;
        }

        # The file name holds no secrets, but the page belongs to no one
        # outside the network.
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy same-origin;
    }
}
