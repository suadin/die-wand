<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DIE WAND</title>
  <meta name="description" content="Your Chrome bookmark bar as a start page.">
  <meta name="theme-color" content="#212529" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)">
  <!-- The number after the name forces Chrome to fetch the icon again. Without
       it the old version sticks in the icon cache, across reloads and across
       devices. -->
  <link rel="icon" href="icon.svg?v=4" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="wall.css">
</head>
<body class="d-flex flex-column min-vh-100">
  <!-- No button: everything comes from Chrome, and what Chrome can do the user
       can do there too. -->
  <header class="border-bottom">
    <div class="container-fluid d-flex flex-wrap align-items-center gap-3 py-3 px-md-4">
      <img class="logo" src="icon.svg" alt="">
      <div>
        <h1 class="h4 mb-0">DIE WAND</h1>
        <p class="text-muted mb-0">Your bookmark bar, one wall away.</p>
      </div>
      <!-- The notice sits in the header, centered. At the bottom it was the most
           conspicuous part of the page, which is exactly what bothered. -->
      <p id="notice" class="text-muted small text-center mx-auto mb-0" hidden></p>
    </div>
  </header>

  <main class="container-fluid flex-grow-1 py-4 px-md-4">
    <div id="wall" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3" aria-live="polite"></div>
  </main>

  <footer class="border-top py-2 mt-auto text-center small">
    <a href="test/index.html">Tests</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
