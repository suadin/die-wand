<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="DIE WAND">
  <title>DIE WAND</title>
  <!-- Three rows of bricks with staggered joints, matching the heading where
       this same icon now stands next to the name. Bold shapes instead of many:
       at 16 pixels in the tab the finer 3x3 grid collapsed into a smudge. -->
