    <rect x="2" y="4" width="14" height="6.5" rx="1.6"/>
    <rect x="17.5" y="4" width="12.5" height="6.5" rx="1.6"/>
    <rect x="2" y="12.75" width="9" height="6.5" rx="1.6"/>
    <rect x="12.5" y="12.75" width="17.5" height="6.5" rx="1.6"/>
    <rect x="2" y="21.5" width="14" height="6.5" rx="1.6"/>
    <rect x="17.5" y="21.5" width="12.5" height="6.5" rx="1.6"/>
  </g>
</svg>
